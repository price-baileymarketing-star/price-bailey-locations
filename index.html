<style>
/* ==========================================================================
   BRAND TOKENS: swap these for the exact values in the Price Bailey guidelines
   ========================================================================== */
:root{
  --pb-navy:#132130;         /* PB navy (dark sections) */
  --pb-navy-2:#1d3346;       /* PB navy-soft */
  --pb-navy-3:#2b4862;       /* borders, hover */
  --pb-accent:#e6457a;       /* PB pink */
  --pb-accent-ink:#b8325f;   /* PB pink, darker (hover) */
  --pb-accent-2:#ff9cc0;     /* PB light pink for glows and small text on navy */
  --pb-teal:#1fa6a0;         /* PB teal  (VERIFY exact hex against brand guidelines) */
  --pb-teal-2:#7fd8d2;       /* light teal for text and lines on navy */
  --pb-teal-ink:#0e6e69;     /* dark teal for text on white */
  --pb-ink:#ffffff;
  --pb-ink-2:rgba(255,255,255,.72);
  --pb-ink-3:rgba(255,255,255,.48);
  --pb-line:rgba(255,255,255,.10);
  --pb-font:'Volte','Figtree','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; /* matches location page */
  --panel-w:360px;      /* office panel width (desktop) */
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--pb-navy);color:var(--pb-ink);font-family:var(--pb-font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pb-accent-2);outline-offset:3px;border-radius:6px}

/* Narrower office panel on mid-width frames so the side-by-side layout still fits */
@media (max-width:1040px){:root{--panel-w:320px}}

/* ---------- Shell ---------- */
.pbmap{position:relative;width:100%;height:100%;min-height:520px;overflow:hidden;
  background:
    radial-gradient(1200px 700px at 72% 55%, rgba(230,69,122,.10), transparent 60%),
    radial-gradient(900px 600px at 20% 10%, rgba(43,72,98,.45), transparent 60%),
    var(--pb-navy);}
.stage{position:absolute;inset:0}
.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}

/* faint grid over the sea */
.pbmap::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--pb-line) 1px, transparent 1px),linear-gradient(90deg,var(--pb-line) 1px, transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(ellipse at 60% 50%, #000 20%, transparent 75%);}

/* ---------- Header ---------- */
.head{position:absolute;top:28px;left:32px;z-index:5;max-width:min(460px, calc(100% - var(--panel-w) - 96px));pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--pb-teal-2)}
.eyebrow::before{content:"";width:24px;height:2px;background:var(--pb-teal)}
.head h1{font-size:clamp(26px, 3.2vw, 40px);line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:12px 0 10px}
.head p{font-size:15px;line-height:1.5;color:var(--pb-ink-2);max-width:40ch}

/* ---------- View toggle ---------- */

/* ---------- Pins (HTML overlay so text never scales) ---------- */
.pin{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-50%);will-change:transform}
.pin-dot{position:relative;display:block;width:16px;height:16px;border-radius:50%;background:var(--pb-accent);
  box-shadow:0 0 0 3px var(--pb-navy),0 0 0 4.5px rgba(255,255,255,.85),0 0 24px 4px rgba(230,69,122,.55);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.pin-dot::before,.pin-dot::after{content:"";position:absolute;inset:-4px;pointer-events:none;border-radius:50%;border:1.5px solid var(--pb-accent-2);opacity:0;animation:pulse 2.8s ease-out infinite}
.pin-dot::after{animation-delay:1.4s}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.pin:hover .pin-dot,.pin.is-active .pin-dot{transform:scale(1.35)}
.pin:hover,.pin:focus-visible{z-index:3}.pin.is-active,.pin.is-current{z-index:2}
.pin.is-current .pin-dot{width:20px;height:20px;background:#fff;box-shadow:0 0 0 4px var(--pb-accent),0 0 0 6px rgba(255,255,255,.9),0 0 34px 8px rgba(230,69,122,.7)}

.label{position:absolute;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.01em;padding:6px 10px;border-radius:8px;
  background:rgba(19,33,48,.85);border:1px solid var(--pb-line);backdrop-filter:blur(6px);pointer-events:none;
  transition:background .25s,border-color .25s,transform .25s}
.label small{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pb-teal-2);margin-bottom:2px}
.pin.is-active .label,.pin:hover .label{background:var(--pb-accent);border-color:var(--pb-accent)}
.pin.is-active .label small,.pin:hover .label small{color:#fff}
/* label placement around the pin */
.l-r{left:22px;top:50%;transform:translateY(-50%)}
.l-l{right:22px;top:50%;transform:translateY(-50%)}
.l-t{bottom:22px;left:50%;transform:translateX(-50%)}
.l-b{top:22px;left:50%;transform:translateX(-50%)}
.l-tl{right:14px;bottom:14px}
.l-tr{left:14px;bottom:14px}
.l-bl{right:14px;top:14px}
.l-br{left:14px;top:14px}
.pbmap.is-far .label{opacity:0;transform:none}  /* hide labels in UK view, show on hover */
.pbmap.is-far .pin:hover .label,.pbmap.is-far .pin.is-active .label{opacity:1}
.pbmap.is-far .pin-dot{width:10px;height:10px}
.pbmap.is-far .pin-dot::before,.pbmap.is-far .pin-dot::after{display:none}

/* entrance */
.pin{opacity:0}
.pin.in{opacity:1;transition:opacity .5s}
.pin.in .pin-dot{animation:drop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{transform:translateY(-30px) scale(.3)}to{transform:none}}

/* ---------- Hover card ---------- */
.tip{position:absolute;z-index:6;width:320px;padding:14px 16px 14px;border-radius:var(--radius);pointer-events:none;
  background:#fff;color:#16202c;box-shadow:0 24px 60px rgba(0,0,0,.45);border-top:4px solid var(--pb-teal);
  opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip .t-tag{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pb-teal-ink);margin-bottom:4px}
.tip h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.tip dl{display:grid;grid-template-columns:18px 1fr;gap:5px 9px;font-size:13px;line-height:1.4;color:#55606f;margin-bottom:10px}
.tip dt svg{width:15px;height:15px;stroke:var(--pb-teal);fill:none;stroke-width:1.9;margin-top:2px}
.tip dd a{color:#16202c;font-weight:600;text-decoration:none}
.tip dd a:hover{color:var(--pb-accent-ink)}
.tip .t-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8a93a0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(31,166,160,.12);color:var(--pb-teal-ink)}
.chip.fallback{background:#f6f7f9;color:#55606f}
.tip .btn{width:100%;padding:9px 12px}

/* ---------- Panel ---------- */
.panel{position:absolute;top:24px;right:24px;bottom:24px;width:var(--panel-w);z-index:5;display:flex;flex-direction:column;
  border-radius:var(--radius);background:rgba(29,51,70,.74);border:1px solid var(--pb-line);backdrop-filter:blur(16px);overflow:hidden}
.panel-head{padding:18px 20px 14px;border-bottom:1px solid var(--pb-line);display:flex;justify-content:space-between;align-items:baseline}
.panel-head h2{font-size:14px;font-weight:800;letter-spacing:.02em}
.panel-head span{font-size:12px;color:var(--pb-ink-3)}
.list{list-style:none;overflow:auto;flex:1;padding:6px}
.row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 12px;border-radius:10px;transition:background .2s}
.row:hover,.row.is-active{background:rgba(255,255,255,.07)}
.row .num{width:12px;height:12px;border-radius:50%;margin-left:4px;border:2px solid var(--pb-accent);transition:all .2s}
.row .go{font-size:18px;color:var(--pb-ink-3);transition:transform .2s,color .2s}
.row:hover .go,.row.is-active .go{color:var(--pb-ink);transform:translateX(3px)}
.group-head{padding:12px 12px 4px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pb-teal-2)}
.in-group .row{padding-left:22px}
.row.is-active .num,.row:hover .num{background:var(--pb-accent);border-color:var(--pb-accent);color:#fff}
.row.is-current .num{background:#fff;border-color:#fff;color:var(--pb-navy)}
.row b{display:block;font-size:15px;font-weight:700}
.row em{font-style:normal;font-size:12px;color:var(--pb-ink-3)}

/* details drawer */
.detail{border-top:1px solid var(--pb-line);padding:18px 20px 20px;background:rgba(19,33,48,.6)}
.detail[hidden]{display:none}
.detail .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pb-teal-2);margin-bottom:6px}
.detail h3{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.detail .blurb{font-size:13px;line-height:1.5;color:var(--pb-ink-2);margin-bottom:12px}
.detail dl{display:grid;grid-template-columns:20px 1fr;gap:8px 10px;font-size:13px;line-height:1.45;margin-bottom:16px}
.detail dt svg{width:16px;height:16px;stroke:var(--pb-teal-2);fill:none;stroke-width:1.8;margin-top:1px}
.detail dd a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
.detail dd a:hover{border-color:var(--pb-accent-2)}
.detail .chip{background:rgba(127,216,210,.14);color:var(--pb-teal-2)}
.detail .chip.fallback{background:rgba(255,255,255,.08);color:var(--pb-ink-2)}
.ctas{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:11px 12px;border-radius:999px;font-size:13px;font-weight:800;text-decoration:none;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--pb-accent);color:#fff}
.btn-primary:hover{background:var(--pb-accent-ink)}
.btn-ghost{border:1px solid rgba(255,255,255,.3)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.foot{padding:10px 20px;font-size:11px;color:var(--pb-ink-3);border-top:1px solid var(--pb-line)}

/* ---------- Mobile: map on top, panel below ---------- */
@media (max-width: 820px){
  /* Fill the iframe as a column: heading, then map, then a panel whose list scrolls on its own */
  .pbmap{display:flex;flex-direction:column;height:100%;min-height:0}
  .head{position:relative;top:auto;left:auto;max-width:none;padding:18px 16px 12px;flex:0 0 auto}
  .wrap-stage{position:relative;flex:1 1 46%;min-height:200px;overflow:hidden}
  .stage{position:absolute;inset:0;height:auto}
  /* panel scrolls as one piece (list then detail) with a sticky header, so the detail never squeezes the list */
  .panel{position:relative;inset:auto;width:auto;margin:0 12px 12px;flex:1 1 54%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .panel-head{position:sticky;top:0;z-index:2;background:rgba(29,51,70,.96);backdrop-filter:blur(16px)}
  .list{flex:0 0 auto;overflow:visible;max-height:none}
  .detail{position:sticky;bottom:0;background:#14263a;box-shadow:0 -14px 28px rgba(8,16,24,.55)}
  .tip{display:none}
  /* phones: only the current or tapped office keeps its name chip; the list below names them all */
  .pin:not(.is-current):not(.is-active) .label{opacity:0}
}
/* Very short frames: hide the heading so map + list still fit */
@media (max-width: 820px) and (max-height: 600px){
  .head{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="pbmap" id="pbmap">
  <header class="head">
    <span class="eyebrow">Price Bailey UK offices</span>
    <h1 id="title">Find your nearest office</h1>
    <p id="sub">Price Bailey has 11 offices across London, Oxford and the East of England. Select an office for its address, contact details and specialisms.</p>
  </header>

  <div class="wrap-stage">
    <div class="stage" id="stage">
      <svg id="map" role="img" aria-labelledby="title" preserveAspectRatio="none">
        <defs>
          <radialGradient id="spot" gradientUnits="userSpaceOnUse" r="60">
            <stop offset="0" stop-color="#ff9cc0" stop-opacity=".95"/>
            <stop offset=".45" stop-color="#e6457a" stop-opacity=".45"/>
            <stop offset="1" stop-color="#e6457a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="torch" gradientUnits="userSpaceOnUse" r="40">
            <stop offset="0" stop-color="#7fd8d2" stop-opacity=".85"/>
            <stop offset="1" stop-color="#7fd8d2" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="arcGrad" gradientUnits="objectBoundingBox">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#e6457a" stop-opacity=".9"/>
          </linearGradient>
        </defs>
        <g id="world">
          <path id="ieDots" fill="none" stroke="rgba(255,255,255,.10)" stroke-linecap="round"/>
          <path id="ukDots" fill="none" stroke="rgba(190,205,222,.28)" stroke-linecap="round"/>
          <path id="ukGlow" fill="none" stroke="url(#spot)" stroke-linecap="round"/>
          <path id="ukTorch" fill="none" stroke="url(#torch)" stroke-linecap="round" opacity="0"/>
          <path id="ukCoast" fill="none" stroke="rgba(255,255,255,.22)" vector-effect="non-scaling-stroke" stroke-width="1"/>
          <g id="arcs"></g>
        </g>
      </svg>
      <div class="overlay" id="overlay"></div>
      <div class="tip" id="tip" role="presentation"></div>
    </div>

  </div>

  <aside class="panel" aria-label="Office list">
    <div class="panel-head"><h2 id="count">UK offices</h2><span>A to Z</span></div>
    <ul class="list" id="list"></ul>
    <section class="detail" id="detail" hidden aria-live="polite"></section>
  </aside>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const root = $("#pbmap"), svg = $("#map"), stage = $("#stage"), overlay = $("#overlay"), tip = $("#tip");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const params = new URLSearchParams(location.search);

  // Merge projected coordinates into office records
  const pos = Object.fromEntries(GEO.placed.map(p => [p.id, p]));
  const offices = CONFIG.offices.filter(o => pos[o.id]).map((o, i) => ({ ...o, n: i + 1, x: pos[o.id].x, y: pos[o.id].y }));
  const byId = Object.fromEntries(offices.map(o => [o.id, o]));

  // ?office=<id> marks "you are here" for the page the iframe sits on
  const currentId = byId[params.get("office")] ? params.get("office") : null;
  let selectedId = currentId, hoverId = null;
  const anchorId = () => selectedId || currentId || CONFIG.headOfficeId; // arcs + distances radiate from here

  // ---------- Static geometry ----------
  $("#ukDots").setAttribute("d", GEO.ukDots);
  $("#ukGlow").setAttribute("d", GEO.ukDots);
  $("#ukTorch").setAttribute("d", GEO.ukDots);
  $("#ieDots").setAttribute("d", GEO.ieDots);
  $("#ukCoast").setAttribute("d", GEO.ukOutline);
  $("#count").textContent = `UK offices (${offices.length})`;

  // ---------- Distance (haversine, miles) ----------
  const miles = (a, b) => {
    const R = 3958.8, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };

  // ---------- Camera: animated viewBox ----------
  let vb = { x: 0, y: 0, w: GEO.W, h: GEO.H }, anim = null;
  const isMobile = () => innerWidth <= 860;
  const size = () => ({ w: stage.clientWidth, h: stage.clientHeight });

  // Fit a bbox into the free area of the stage (left of the panel on desktop)
  // Fit a bbox into the free area of the stage. m: screen margins (px) around the free
  // area, p: extra screen padding around the bbox so labels are not clipped.
  function fit(b, m, p) {
    const { w, h } = size();
    const aw = Math.max(w - m.r - m.l - p.l - p.r, 100), ah = Math.max(h - m.t - m.b - p.t - p.b, 100);
    const bw = Math.max(b.x1 - b.x0, 1), bh = Math.max(b.y1 - b.y0, 1);
    const s = Math.min(aw / bw, ah / bh);
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    const sx = m.l + p.l + aw / 2, sy = m.t + p.t + ah / 2;
    return { x: cx - sx / s, y: cy - sy / s, w: w / s, h: h / s };
  }
  const bboxOf = list => ({
    x0: Math.min(...list.map(o => o.x)), x1: Math.max(...list.map(o => o.x)),
    y0: Math.min(...list.map(o => o.y)), y1: Math.max(...list.map(o => o.y))
  });
  const panelW = () => parseFloat(getComputedStyle(root).getPropertyValue("--panel-w"));
  // approximate screen box of a pin plus its name label
  function pinBox(o, v) {
    const s = size().w / v.w, x = (o.x - v.x) * s, y = (o.y - v.y) * s;
    const lw = o.name.length * 8 + 34, lh = 36;
    const box = { x0: x - 14, x1: x + 14, y0: y - 14, y1: y + 14 };
    if (o.label.includes("l")) box.x0 = x - lw; if (o.label.includes("r")) box.x1 = x + lw;
    if (o.label.includes("t")) box.y0 = y - lh - 10; if (o.label.includes("b")) box.y1 = y + lh + 10;
    if (o.label === "t" || o.label === "b") { box.x0 = x - lw / 2; box.x1 = x + lw / 2; }
    return box;
  }
  const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  function regionView() {
    const bb = bboxOf(offices);
    if (isMobile()) return fit(bb, { t: 12, r: 12, b: 12, l: 12 }, { t: 24, r: 24, b: 16, l: 24 });
    const st = stage.getBoundingClientRect(), hr = document.querySelector(".head").getBoundingClientRect();
    const head = { x0: hr.left - st.left - 8, x1: hr.right - st.left + 16, y0: 0, y1: hr.bottom - st.top + 12 };
    const pad = { t: 46, r: 80, b: 26, l: 40 };
    // try the most generous framing first; step down until nothing collides with the header
    for (let t = 20; t < head.y1; t += 10) {
      const v = fit(bb, { t, r: panelW() + 40, b: 20, l: 24 }, pad);
      if (!offices.some(o => hit(pinBox(o, v), head))) return v;
    }
    return fit(bb, { t: head.y1, r: panelW() + 40, b: 20, l: 24 }, pad);
  }
  const VIEWS = {
    region: regionView,
    uk: () => fit({ x0: 30, x1: GEO.W - 30, y0: 20, y1: GEO.H - 20 }, { t: 20, r: isMobile() ? 12 : panelW() + 40, b: 20, l: 24 }, { t: 0, r: 0, b: 0, l: 0 }),
    office: o => fit({ x0: o.x - 55, x1: o.x + 55, y0: o.y - 55, y1: o.y + 55 }, { t: 20, r: isMobile() ? 12 : panelW() + 40, b: 20, l: 24 }, { t: 0, r: 0, b: 0, l: 0 })
  };
  let view = "region";

  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function flyTo(target, ms = 1100) {
    cancelAnimationFrame(anim);

    const from = { ...vb }, t0 = performance.now();

      vb = { x: cx - w / 2, y: cy - (from.h * k) / 2, w, h: from.h * k };
      render();
      if (t < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  // ---------- Build pins + list ----------
  const pinEls = {}, rowEls = {};
  offices.forEach(o => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pin" + (o.id === currentId ? " is-current" : "");
    b.setAttribute("aria-label", `${o.name} office${o.id === currentId ? ", you are here" : ""}`);
    const small = o.id === currentId ? "You are here" : (o.tag || "");
    b.innerHTML = `<span class="pin-dot"></span><span class="label l-${o.label}">${small ? `<small>${small}</small>` : ""}${o.name}</span>`;
    b.addEventListener("mouseenter", () => setHover(o.id));
    b.addEventListener("mouseleave", () => scheduleHide());
    b.addEventListener("focus", () => setHover(o.id));
    b.addEventListener("blur", () => scheduleHide());
    b.addEventListener("click", () => select(o.id, true));
    overlay.appendChild(b); pinEls[o.id] = b;

  });

  // List: A to Z, offices sharing a group (London) sit together under one heading
  const sortKey = o => (o.group || o.name) + " " + o.name;
  const seen = new Set();
  [...offices].sort((a, b) => sortKey(a).localeCompare(sortKey(b), "en-GB")).forEach(o => {
    if (o.group && !seen.has(o.group)) {
      seen.add(o.group);
      const h = document.createElement("li"); h.className = "group-head"; h.textContent = o.group;
      $("#list").appendChild(h);
    }
    const li = document.createElement("li");
    if (o.group) li.className = "in-group";
    li.innerHTML = `<button type="button" class="row${o.id === currentId ? " is-current" : ""}">
      <span class="num"></span><span><b>${o.name}</b><em>${o.id === currentId ? "You are here" : (o.tag || o.county)}</em></span>
      <span class="go" aria-hidden="true">›</span></button>`;
    const row = li.firstElementChild;
    row.addEventListener("mouseenter", () => setHover(o.id));
    row.addEventListener("mouseleave", () => scheduleHide());
    row.addEventListener("click", () => select(o.id, true));
    $("#list").appendChild(li); rowEls[o.id] = row;
  });

  // ---------- Arcs from the anchor office ----------
  const NS = "http://www.w3.org/2000/svg";
  function drawArcs() {
    const g = $("#arcs"); g.innerHTML = "";
    const a = byId[anchorId()];
    const k = vb.w / size().w; // user units per screen px
    offices.forEach(o => {
      if (o.id === a.id) return;
      const mx = (a.ux + o.ux) / 2, my = (a.uy + o.uy) / 2;
      const dx = o.ux - a.ux, dy = o.uy - a.uy, len = Math.hypot(dx, dy) || 1;
      const bend = len * .28;

        p.appendChild(an);
      }
      g.appendChild(p);
    });
  }


  // ---------- Render: sync SVG viewBox and HTML overlay ----------
  let mouse = null;
  function render() {
    const { w } = size();
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    const s = w / vb.w; // screen px per user unit
    // dot size: about 45% of grid spacing on screen, never thinner than 1.2px
    const dw = Math.max(2.1 * .5, .9 / s);
    ["#ukDots", "#ieDots", "#ukGlow", "#ukTorch"].forEach(id => $(id).setAttribute("stroke-width", dw));
    // spotlight on the anchor office
    const a = byId[anchorId()], spot = $("#spot");
    spot.setAttribute("cx", a.x); spot.setAttribute("cy", a.y);
    spot.setAttribute("r", Math.min(Math.max(vb.w * .16, 18), 60));
    $("#torch").setAttribute("r", Math.max(vb.w * .09, 10));
    root.classList.toggle("is-far", s < 2.4);
    // screen-space collision pass: nudge pins that sit too close (City/Mayfair, Cambridge/Sawston)
    const min = s < 2.4 ? 13 : 24;
    offices.forEach(o => { o.sx = (o.x - vb.x) * s; o.sy = (o.y - vb.y) * s; });
    for (let it = 0; it < 8; it++) for (let i = 0; i < offices.length; i++) for (let j = i + 1; j < offices.length; j++) {
      const A = offices[i], B = offices[j];
      let dx = B.sx - A.sx, dy = B.sy - A.sy, d = Math.hypot(dx, dy);
      if (d >= min) continue;
      if (d < .01) { dx = 1; dy = 0; d = 1; }
      const push = (min - d) / 2, nx = dx / d, ny = dy / d;
      A.sx -= nx * push; A.sy -= ny * push; B.sx += nx * push; B.sy += ny * push;
    }
    offices.forEach(o => {
      o.ux = vb.x + o.sx / s; o.uy = vb.y + o.sy / s; // displaced position in map units, used by arcs
      pinEls[o.id].style.transform = `translate(${o.sx}px, ${o.sy}px) translate(-50%,-50%)`;
    });
    drawArcs();
    if (hoverId) placeTip(hoverId);
  }

  // ---------- Interaction ----------
  // ---------- Hover card ----------
  let tipId = null, hideTimer = null;
  const hoursOf = o => o.hours || CONFIG.defaultHours;
  const telLink = (o, cls = "") => o.phone && o.phone !== "TBC" ? `<a${cls} href="tel:${e164(o.phone)}">${intl(o.phone)}</a>` : (o.phone || "");
  const chipsOf = o => o.specialisms && o.specialisms.length
    ? o.specialisms.map(x => `<span class="chip">${x}</span>`).join("")
    : `<span class="chip fallback">${CONFIG.specialismsFallback}</span>`;
  function fillTip(o) {
    const tag = o.id === currentId ? "You are here" : (o.tag || o.county);
    tip.innerHTML = `
      <span class="t-tag">${tag}</span>
      <h3>${o.name}</h3>
      <dl>
        <dt>${ICON.pin}</dt><dd>${o.address}</dd>
        <dt>${ICON.tel}</dt><dd>${telLink(o)}</dd>
        <dt>${ICON.clock}</dt><dd>${hoursOf(o)}</dd>
      </dl>
      <div class="chips">${chipsOf(o)}</div>
      ${o.id === currentId ? "" : `<a class="btn btn-primary" target="_top" href="${o.url}">Visit location page</a>`}`;
  }
  function placeTip(id) {
    const o = byId[id], { w, h } = size();
    if (tipId !== id) { fillTip(o); tipId = id; }
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 26, m = 12;
    const limit = w - (isMobile() ? 0 : panelW() + 40);
    const clampX = x => Math.min(Math.max(x, m), limit - tw - m);
    const clampY = y => Math.min(Math.max(y, m), h - th - m);
    // candidate spots around the pin; score = pins (and their labels) the card would cover
    const cands = [
      [o.sx + gap, o.sy - th / 2], [o.sx - tw - gap, o.sy - th / 2],
      [o.sx + gap, o.sy - th + 30], [o.sx + gap, o.sy - 30],
      [o.sx - tw - gap, o.sy - th + 30], [o.sx - tw - gap, o.sy - 30],
      [o.sx - tw / 2, o.sy - th - gap], [o.sx - tw / 2, o.sy + gap]
    ];
    // plus a grid of spots across the free area, so the card can move off a crowded cluster
    for (let gx = m; gx <= limit - tw - m; gx += 40) for (let gy = m; gy <= h - th - m; gy += 40) cands.push([gx, gy]);
    const st = stage.getBoundingClientRect(), hr = document.querySelector(".head").getBoundingClientRect();
    const head = { x0: hr.left - st.left, x1: hr.right - st.left, y0: hr.top - st.top, y1: hr.bottom - st.top };
    let best = null;
    cands.forEach(([x, y], i) => {
      const cx = clampX(x), cy = clampY(y);
      const box = { x0: cx - 10, x1: cx + tw + 10, y0: cy - 10, y1: cy + th + 10 };
      let score = 0;
      offices.forEach(q => {
        const pb = { x0: q.sx - 12, x1: q.sx + 12, y0: q.sy - 12, y1: q.sy + 12 };
        if (hit(box, pb)) score += q.id === o.id ? 100 : 10;   // never cover the hovered pin
        else if (hit(box, pinBox(q, vb))) score += 1;           // labels count a little
      });
      if (!isMobile() && hit(box, head)) score += 3;                // avoid the heading if possible
      // prefer spots close to the pin
      const dx = Math.max(cx - o.sx, 0, o.sx - (cx + tw)), dy = Math.max(cy - o.sy, 0, o.sy - (cy + th));
      score += Math.hypot(dx, dy) / 250 + (i < 8 ? 0 : .15);
      if (!best || score < best.score) best = { score, x: cx, y: cy };
    });
    tip.style.left = best.x + "px"; tip.style.top = best.y + "px";
  }
  function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(() => setHover(null), 220); }
  tip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
  tip.addEventListener("mouseleave", () => scheduleHide());
  function setHover(id) {
    clearTimeout(hideTimer);
    hoverId = id;
    offices.forEach(o => {
      const on = o.id === id || o.id === selectedId;
      pinEls[o.id].classList.toggle("is-active", on);
      rowEls[o.id].classList.toggle("is-active", on);
    });
    tip.classList.toggle("show", !!id);
    render();
  }
  // PB style: phone numbers shown as +44 (0)1245 202613, dialled as +441245202613
  const intl = n => "+44 (0)" + n.replace(/^0/, "");
  const e164 = n => "+44" + n.replace(/\s/g, "").replace(/^0/, "");
  const ICON = {
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    tel: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
    mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
  };
  function select(id, fly) {
    selectedId = id;
    const o = byId[id], d = $("#detail");
    const tel = o.phone && o.phone !== "TBC" ? `<a href="tel:${e164(o.phone)}">${intl(o.phone)}</a>` : (o.phone || "");
    const directions = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.address.includes("TBC") ? `${o.lat},${o.lng}` : o.address)}`;
    d.innerHTML = `
      <span class="tag">${o.id === currentId ? "You are here" : (o.tag || o.county)}</span>
      <h3>${o.name}</h3>
      <dl>
        <dt>${ICON.pin}</dt><dd>${o.address}</dd>
        ${tel ? `<dt>${ICON.tel}</dt><dd>${tel}</dd>` : ""}
        <dt>${ICON.clock}</dt><dd>${hoursOf(o)}</dd>
      </dl>
      <div class="chips">${chipsOf(o)}</div>
      <div class="ctas">
        ${o.id === currentId ? "" : `<a class="btn btn-primary" target="_top" href="${o.url}">Visit location page</a>`}
        <a class="btn btn-ghost" target="_blank" rel="noopener" href="${directions}">Get directions</a>
      </div>`;
    d.hidden = false;
    setHover(hoverId);
    if (fly) { view = null; setView(null); flyTo(VIEWS.office(o)); }
  }
  function setView(v) {
    if (v) view = v;
    if (v) flyTo(VIEWS[v]());
  }
  addEventListener("keydown", e => {
    if (e.key === "Escape") { selectedId = currentId; $("#detail").hidden = !currentId; if (currentId) select(currentId, false); setHover(null); setView("region"); }
  });

  // torch: dots light up under the cursor
  stage.addEventListener("pointermove", e => {
    const r = stage.getBoundingClientRect(), s = r.width / vb.w;
    const t = $("#torch"); t.setAttribute("cx", vb.x + (e.clientX - r.left) / s); t.setAttribute("cy", vb.y + (e.clientY - r.top) / s);
    $("#ukTorch").setAttribute("opacity", ".9");
  });
  stage.addEventListener("pointerleave", () => $("#ukTorch").setAttribute("opacity", "0"));

  // ---------- Resize + iframe auto-height ----------
  const postHeight = () => parent !== window && parent.postMessage({ type: "pb-office-map:height", height: document.documentElement.scrollHeight }, "*");
  new ResizeObserver(() => {
    cancelAnimationFrame(anim);
    vb = selectedId && view === null ? VIEWS.office(byId[selectedId]) : VIEWS[view || "region"]();
    render(); postHeight();
  }).observe(stage);

  // ---------- Intro: start on the whole UK, then fly into the region ----------
  vb = VIEWS.uk(); render();
  if (currentId) select(currentId, false);
  if (currentId) { $("#title").textContent = `Our ${byId[currentId].name} office and the wider team`; }
  offices.forEach((o, i) => setTimeout(() => pinEls[o.id].classList.add("in"), reduced ? 0 : 500 + i * 110));
  setTimeout(() => setView(view), reduced ? 0 : 450);
  addEventListener("load", postHeight);
})();
</script>
</body>
</html>
